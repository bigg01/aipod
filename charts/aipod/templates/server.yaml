{{- if .Values.server.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aipod.serverName" . }}
  labels:
    {{- include "aipod.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "aipod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "aipod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- $ann := merge (dict) (.Values.server.podAnnotations | default dict) }}
      {{- $scrape := fromYaml (include "aipod.scrapeAnnotations" (dict "exporter" .Values.metrics.exporter "enabled" .Values.metrics.prometheusScrapeAnnotations "port" .Values.server.containerPort)) }}
      {{- if $scrape }}{{ $ann = merge $ann $scrape }}{{ end }}
      {{- with $ann }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aipod.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: aipod
          image: {{ include "aipod.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{ toJson .Values.server.args }}
          envFrom:
            - configMapRef:
                name: {{ include "aipod.configName" . }}
          {{- if or .Values.auth.enabled .Values.metrics.exporter }}
          env:
          {{- if .Values.auth.enabled }}
            # Bearer-token auth: /mcp becomes an OAuth 2.1 protected resource.
            - name: AIPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aipod.authSecretName" . }}
                  key: {{ .Values.auth.secretKey }}
          {{- end }}
          {{- include "aipod.metricsEnv" . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.containerPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aipod.serverName" . }}
  labels:
    {{- include "aipod.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "aipod.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
{{- if .Values.server.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aipod.serverName" . }}
  labels:
    {{- include "aipod.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.server.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.server.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.server.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.server.ingress.path }}
            pathType: {{ .Values.server.ingress.pathType }}
            backend:
              service:
                name: {{ include "aipod.serverName" . }}
                port:
                  name: http
{{- end }}
{{- end }}
