apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aipod.configName" . }}
  labels:
    {{- include "aipod.commonLabels" . | nindent 4 }}
data:
  AIPOD_MCP_URL: {{ include "aipod.mcpUrl" . | quote }}
  {{- range $key, $value := .Values.config }}
  {{- if ne $key "AIPOD_MCP_URL" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
