[project]
name = "aipod"
version = "0.1.5"
description = "One binary, two modes: a reference MCP server that exercises every MCP feature, or a pydantic-ai agent that consumes it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29",
    "pydantic-ai-slim[mcp]>=1.0",
    "pydantic>=2.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-exporter-prometheus>=0.50b0",
    "prometheus-client>=0.20",
]

[project.scripts]
aipod = "aipod.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipod"]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]
build = [
    "pyinstaller>=6.22",
    "staticx>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
