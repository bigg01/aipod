<svg xmlns="http://www.w3.org/2000/svg" width="940" height="292" viewBox="0 0 940 292">
  <defs>
    <clipPath id="rounded"><rect x="0" y="0" width="940" height="292" rx="12" ry="12"/></clipPath>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3d"/>
      <stop offset="1" stop-color="#20242f"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="940" height="292" fill="#1b1e27"/>
    <rect x="0" y="0" width="940" height="34" fill="url(#titlebar)"/>
    <circle cx="20" cy="17.0" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17.0" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17.0" r="6" fill="#27c93f"/>
    <text x="470.0" y="21.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#aab2c0">aipod — OpenTelemetry metrics (AIPOD_METRICS=prometheus)</text>
    <rect x="0" y="0" width="940" height="292" fill="none" stroke="#2f3444" stroke-width="1"/>
    <text x="18" y="46" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#7ee787" font-weight="600">$ </tspan><tspan fill="#e6edf3">podman run -d --rm -p 18000:8000 -e AIPOD_METRICS=prometheus aipod:latest</tspan></text><text x="18" y="65" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9da7b3"></tspan></text><text x="18" y="84" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5c6472" font-style="italic"># call a couple of tools through the MCP Inspector</tspan></text><text x="18" y="103" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#7ee787" font-weight="600">$ </tspan><tspan fill="#e6edf3">$I --method tools/call --tool-name get_hero --tool-arg codename=storm</tspan></text><text x="18" y="122" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#7ee787" font-weight="600">$ </tspan><tspan fill="#e6edf3">$I --method tools/call --tool-name get_hero --tool-arg codename=spider-man</tspan></text><text x="18" y="141" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#7ee787" font-weight="600">$ </tspan><tspan fill="#e6edf3">$I --method tools/call --tool-name echo --tool-arg message=hi</tspan></text><text x="18" y="160" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9da7b3"></tspan></text><text x="18" y="179" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#7ee787" font-weight="600">$ </tspan><tspan fill="#e6edf3">curl -s http://127.0.0.1:18000/metrics | grep tool_calls_total</tspan></text><text x="18" y="198" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9da7b3">mcp_server_tool_calls_total{mcp_tool_name="get_hero", outcome="ok"} 2.0</tspan></text><text x="18" y="217" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9da7b3">mcp_server_tool_calls_total{mcp_tool_name="echo", outcome="ok"} 1.0</tspan></text><text x="18" y="236" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#9da7b3"></tspan></text><text x="18" y="255" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#5c6472" font-style="italic"># also emits mcp.server.tool.duration (histogram, seconds)</tspan></text>
  </g>
</svg>