<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="aipod — one binary, two modes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
    </style>
  </defs>

  <rect x="4" y="4" width="1192" height="352" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="1191" height="351" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>

  <!-- logo tile -->
  <g transform="translate(78,48)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="11" y="23" width="42" height="18" rx="9" fill="#ffffff" opacity="0.96"/>
    <circle cx="23" cy="32" r="4.5" fill="#3584e4"/>
    <circle cx="43" cy="32" r="4.5" fill="#1a5fb4"/>
    <path d="M23 32h20" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- wordmark + copy -->
  <text x="162" y="100" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">aipod</text>
  <text x="80" y="170" font-size="27" font-weight="600" fill="#eef4fe">one binary, two modes</text>
  <text x="80" y="208" font-size="16" fill="#d3e4fb" letter-spacing="0.3">a reference MCP server that exercises every MCP feature —</text>
  <text x="80" y="231" font-size="16" fill="#d3e4fb" letter-spacing="0.3">and a pydantic-ai agent that consumes it</text>
  <text x="80" y="300" font-size="14" fill="#bcd6f7" letter-spacing="0.5">FastMCP · pydantic-ai · one ~34 MB FROM scratch container</text>

  <!-- mode diagram -->
  <path d="M770 182 C 840 182 840 102 910 102" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85"/>
  <path d="M770 182 C 840 182 840 294 910 294" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85"/>
  <circle cx="770" cy="182" r="5" fill="#1a5fb4"/>
  <circle cx="910" cy="102" r="5" fill="#1a5fb4"/>
  <circle cx="910" cy="294" r="5" fill="#1a5fb4"/>

  <rect x="620" y="150" width="150" height="64" rx="32" fill="#ffffff"/>
  <text x="695" y="189" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5fb4">one binary</text>

  <rect x="910" y="70" width="210" height="64" rx="32" fill="#ffffff"/>
  <text x="1015" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5fb4">aipod server</text>
  <text x="1015" y="119" text-anchor="middle" font-size="12.5" fill="#3584e4">MCP · /contract.json</text>

  <rect x="910" y="262" width="210" height="64" rx="32" fill="#ffffff"/>
  <text x="1015" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5fb4">aipod agent</text>
  <text x="1015" y="311" text-anchor="middle" font-size="12.5" fill="#3584e4">A2A · agent-card.json</text>
</svg>
