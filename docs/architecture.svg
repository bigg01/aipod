<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="aipod architecture: MCP clients and agent platforms talk to aipod server, aipod agent talks to aipod server and to a model">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
    </style>
  </defs>

  <rect x="4" y="4" width="1112" height="292" rx="24" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="1111" height="291" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>

  <text x="40" y="42" font-size="15" font-weight="700" fill="#eef4fe" letter-spacing="0.5">HOW IT FITS TOGETHER</text>

  <!-- box A: clients -->
  <rect x="30" y="96" width="240" height="96" rx="16" fill="#ffffff"/>
  <text x="150" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#1a5fb4">MCP clients</text>
  <text x="150" y="150" text-anchor="middle" font-size="12" fill="#3584e4">Inspector · Claude Code</text>
  <text x="150" y="168" text-anchor="middle" font-size="12" fill="#3584e4">kagent · kars · AI Foundry</text>

  <!-- box B: server -->
  <rect x="335" y="96" width="220" height="96" rx="16" fill="#ffffff"/>
  <text x="445" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#1a5fb4">aipod server</text>
  <text x="445" y="150" text-anchor="middle" font-size="12" fill="#3584e4">tools · resources · prompts</text>
  <text x="445" y="168" text-anchor="middle" font-size="12" fill="#3584e4">/contract.json · /metrics</text>

  <!-- box C: agent -->
  <rect x="630" y="96" width="220" height="96" rx="16" fill="#ffffff"/>
  <text x="740" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#1a5fb4">aipod agent</text>
  <text x="740" y="150" text-anchor="middle" font-size="12" fill="#3584e4">pydantic-ai + model</text>
  <text x="740" y="168" text-anchor="middle" font-size="12" fill="#3584e4">/agent-card.json</text>

  <!-- box D: your app -->
  <rect x="920" y="96" width="170" height="96" rx="16" fill="#ffffff" fill-opacity="0.94"/>
  <text x="1005" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fb4">your app</text>
  <text x="1005" y="156" text-anchor="middle" font-size="12" fill="#3584e4">POST /ask</text>

  <!-- arrows -->
  <line x1="272" y1="144" x2="331" y2="144" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="301" y="132" text-anchor="middle" font-size="11.5" fill="#eef4fe">MCP</text>

  <line x1="628" y1="144" x2="559" y2="144" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="593" y="132" text-anchor="middle" font-size="11.5" fill="#eef4fe">MCP</text>

  <line x1="852" y1="144" x2="918" y2="144" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="885" y="132" text-anchor="middle" font-size="11.5" fill="#eef4fe">HTTP</text>

  <text x="560" y="248" text-anchor="middle" font-size="13" fill="#eef4fe">one container, either mode · same image and k8s manifest for both</text>
</svg>
