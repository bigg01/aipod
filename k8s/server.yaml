apiVersion: apps/v1
kind: Deployment
metadata:
  name: aipod-server
  labels:
    app.kubernetes.io/name: aipod
    app.kubernetes.io/component: server
spec:
  # Per-connection session state + background tasks (simulated logging /
  # subscription updates) live in memory -> single replica. Scale out behind a
  # session-affinity load balancer.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aipod
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aipod
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aipod
          image: ghcr.io/bigg01/aipod:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: aipod-config
          env:
            # Optional bearer-token auth. Without this secret the server runs open.
            #   kubectl create secret generic aipod-auth --from-literal=AIPOD_API_KEY=$(openssl rand -hex 16)
            - name: AIPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aipod-auth
                  key: AIPOD_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aipod-server
  labels:
    app.kubernetes.io/name: aipod
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aipod
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
